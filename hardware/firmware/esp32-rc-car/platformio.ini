; PlatformIO Project Configuration File
;
; Nikko NE14 1:14 RC car (Lamborghini Murcielago)
; DC brush motor via L298N H-bridge + steering servo
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev_rc_car]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.10
lib_deps =
    links2004/WebSockets@2.7.3
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    ESP32Servo
    https://github.com/sui77/rc-switch.git

; ---------------------------------------------------------------------------
; OTA upload environment
; Usage:   pio run -t upload -e esp32dev_rc_car_ota
; Replace upload_port with your ESP32 IP shown in the serial monitor.
[env:esp32dev_rc_car_ota]
extends = env:esp32dev_rc_car
upload_protocol = espota
; Set upload_port to your ESP32's IP (shown in serial: "[wifi] connected, ip=...")
upload_port = 0.0.0.0
; Set --auth= to the otaPassword from include/config.h (leave empty if no password)
upload_flags =
    --auth=
