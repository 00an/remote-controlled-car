; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_dir = C:\pio-build\esp32-remote-car
libdeps_dir = C:\pio-libdeps\esp32-remote-car
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
; To upload over Wi-Fi later, set upload_protocol = espota and change upload_port
; to the ESP32's IP address after it boots on your network.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.10
lib_deps =
    links2004/WebSockets@2.7.3
    madhephaestus/ESP32Servo@^3.0.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    bolderflight/Bolder Flight Systems MPU9250@^1.0.2
    AccelStepper@^1.59.0

; ---------------------------------------------------------------------------
; OTA upload environment
; Usage: set the device IP and (optionally) the OTA password below, then run:
;   pio run -t upload -e esp32dev_ota
; or use VS Code PlatformIO targets -> Upload (esp32dev_ota)
; Replace `upload_port` with your ESP32 IP shown in the serial monitor.
[env:esp32dev_ota]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = espota
upload_port = 10.25.232.65    ; <-- set this to your ESP32's IP
upload_flags = --auth=        ; <-- set this to the `otaPassword` from include/config.h if you use one

